name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r ASCR/requirements.txt
          python -m pip install -r ASCR-H/requirements.txt
          python -m pip install pytest

      - name: Compile Python sources
        run: python -m compileall -q ASCR/src ASCR/tests ASCR/scripts ASCR-H/src ASCR-H/tests backtests/src

      - name: Run ASCR tests
        working-directory: ASCR
        run: pytest -q

      - name: Run ASCR-H tests
        working-directory: ASCR-H
        run: pytest -q
