version: 1
trading_policy: watch_only
description: >
  Public chokepoint research watchlist. This file is for discovery and thesis
  tracking only. It must not directly trigger recommendations or trading.

score_model:
  max_component: 20
  positive_components:
  - scarcity
  - dependency
  - concentration
  - validation
  - timing
  negative_components:
  - crowding_risk
  formula: scarcity + dependency + concentration + validation + timing - crowding_risk

rotation_phases:
  early:
    rank: 1
    description: Technical logic exists, but validation and market attention are limited.
  front_run:
    rank: 2
    description: Early validation is visible before broad institutional consensus.
  consensus:
    rank: 3
    description: Thesis is widely understood and upside depends on continued execution.
  crowded:
    rank: 4
    description: Social attention, valuation, or price action may already reflect the thesis.
  broken:
    rank: 5
    description: Demand, pricing, technical path, or customer validation has failed.

themes:
- id: photonics_inp_optical
  name: Photonics and InP optical bottlenecks
  phase: front_run
  thesis: AI clusters need more optical links, and InP/optical component supply can bottleneck 800G and 1.6T deployments.
  chokepoint_pattern: Small enabling suppliers can outperform obvious AI leaders when a technical bottleneck becomes revenue visible.
  validation_events:
  - Customer concentration becomes visible through orders, backlog, or revenue guide.
  - Management confirms supply tightness, allocation, lead times, or pricing power.
  - Hyperscaler or NVDA architecture updates increase optical intensity per rack.
  death_signals:
  - Optical inventory correction or order pushouts.
  - New qualified suppliers remove scarcity.
  - 1.6T or CPO transition timing slips materially.
  candidates:
