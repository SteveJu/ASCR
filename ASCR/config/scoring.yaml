# Scoring weights and thresholds
# V4: event/research anchored. Price momentum remains a stored diagnostic
# dimension for reports/backtests, but it no longer contributes to live
# opportunity_score.
opportunity_weights:
  evidence: 0.50
  asymmetry: 0.40
  momentum: 0.00
  risk: -0.10

# Portfolio-level holding policy.
# This keeps live execution patient enough for high-beta AI winners while still
# allowing urgent exits when price risk or thesis-break evidence is severe.
portfolio_policy:
  min_hold_days_before_thesis_sell: 10
  trailing_activation_pct: 30
  default_trailing_stop_pct: -30
  trailing_min_hold_days: 10
  trailing_winner_widen_pct: 5
  rotation:
    enabled: true
    min_hold_days: 20
    protect_profitable_days: 30
    candidate_min_event_score: 12
    candidate_min_verdict_score: 6
    min_score_ratio: 2.0
    min_score_gap: 4.0

# Telegram event alert policy.
# Routine actionable events stay in the DB and scoring pipeline. Active pushes
# are reserved for unusually material news so Telegram is not flooded.
alert_policy:
  enabled: true
  min_alert_score: 18
  max_events_per_push: 3
  min_confidence: 0.75
  min_abs_evidence_delta: 8
  max_priced_in_pct: 65
  suppress_sources: ["price"]
  high_impact_sources: ["sec", "sec_8k", "sec_filing", "earnings"]
  high_impact_event_types:
    - major_contract
    - contract
    - guidance_raise
    - guidance_lower
    - earnings_beat
    - earnings_miss
    - dilution
    - financing
    - fraud_concern
    - regulation
    - insider_buy
    - acquisition
    - bankruptcy
    - delisting
  explosive_keywords:
    - billion
    - multi-billion
    - material definitive agreement
    - signed contract
    - supply agreement
    - purchase agreement
    - acquisition
    - acquire
    - merger
    - guidance raise
    - guidance cut
    - raises guidance
    - lowers guidance
    - sec investigation
    - doj investigation
    - short report
    - fraud
    - bankruptcy
    - delist
    - halt
    - nvidia invests
    - nvidia partnership
    - hyperscaler contract

# Event alpha turns structured public events into decayed score adjustments.
# This is the project-specific signal layer: filings, contracts, supply-chain
# catalysts, verdict/conviction, source quality, novelty, and priced-in risk.
event_alpha:
  enabled: true
  lookback_days: 45
  half_life_days: 14
  max_evidence_adjustment: 45
  max_asymmetry_adjustment: 35
  max_risk_adjustment: 40
  min_confidence: 0.25
  source_weights:
    sec: 1.20
    sec_filing: 1.20
    form4: 1.15
    press_release: 1.00
    news: 0.85
    google_news: 0.80
    reddit: 0.55
    price_event: 0.60
  event_type_weights:
    major_contract: 1.35
    contract: 1.30
    guidance_raise: 1.25
    guidance: 1.15
    earnings: 1.00
    sec_filing: 1.05
    partnership: 0.90
    insider_buy: 1.15
    insider_sell: 0.75
    dilution: 1.30
    financing: 1.20
    risk: 1.25
    fraud_concern: 1.50
    price_surge: 0.65
    other: 0.70
  verdict_scores:
    STRONG_BUY: 8
    BUY: 5
    HOLD: 0
    AVOID: -5
    SELL: -8
  conviction_weights:
    HIGH: 1.00
    MEDIUM: 0.70
    LOW: 0.40

# Valuation overlay is a bounded sanity check, not a full DCF or value screen.
# P/E is intentionally weak because ASCR is designed to find high-risk,
# early re-rating candidates. Sales, enterprise value, and cash-flow multiples
# carry more weight when deciding whether an event is already priced in.
valuation:
  enabled: true
  max_evidence_adjustment: 6
  max_asymmetry_adjustment: 18
  max_risk_adjustment: 20

# Business quality overlay distinguishes "benefits from an AI supply-chain event"
# from "is a durable business worth researching." Missing fields are neutral.
business_quality:
  enabled: true
  max_evidence_adjustment: 10
  max_asymmetry_adjustment: 8
  max_risk_adjustment: 18

# Feedback alpha uses ASCR-H decision logs and ASCR experience logs.
# It is deliberately bounded and shrinkage-weighted: logs inform scoring, but
# do not override fresh evidence.
feedback_alpha:
  enabled: true
  horizon_days: 20
  min_samples: 5
  full_confidence_samples: 30
  max_adjustment: 12
  paper_trader_db: ../ASCR-H/data/ascr_h.sqlite
  components:
    ticker_alpha: 0.50
    rating_alpha: 0.25
    event_type_alpha: 0.25
    quality: 0.15

# Regime-aware weight adjustments
# Temporarily pinned to the validated calibrated profile. Regime-specific
# scoring overrides should be re-enabled only after separate as-of validation.
regime_weights:
  risk_on:
    evidence: 0.50
    asymmetry: 0.40
    momentum: 0.00
    risk: -0.10
  neutral:
    evidence: 0.50
    asymmetry: 0.40
    momentum: 0.00
    risk: -0.10
  risk_off:
    evidence: 0.50
    asymmetry: 0.40
    momentum: 0.00
    risk: -0.10

# Rating thresholds (Opportunity Score)
ratings:
  S: 75
  A: 60
  B: 45
  C: 30
  D: 0

# Evidence Score components
evidence:
  revenue_acceleration: 20
  gross_margin_expansion: 15
  guidance_raise: 15
  backlog_growth: 15
  major_customer_contract: 10
  strategic_partnership: 10
  ai_segment_growth: 10
  earnings_tone_positive: 5

# Asymmetry Score components
asymmetry:
  small_market_cap_threshold_b: 10
  recent_spinoff_months: 12
  low_analyst_coverage: 5
  ai_revenue_pct_low: 20
  forward_pe_discount: 30

# Price-confirmation diagnostic components.
# Stored as momentum_score for schema compatibility; not used in live
# opportunity_score while the momentum weight is 0.
momentum:
  relative_strength_period_days: 20
  volume_surge_multiplier: 2.0
  near_52w_high_pct: 0.95

# Risk Score components
risk:
  debt_to_equity_high: 2.0
  dilution_recent_months: 6
  customer_concentration_pct: 50
  revenue_decline_quarters: 2
